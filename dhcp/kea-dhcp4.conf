{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "ens19" ]
    },

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv"
    },

    "valid-lifetime": 4000,

    "subnet4": [
      {
        "id": 1,
        "subnet": "10.104.0.0/24",

        "pools": [
          {
            "pool": "10.104.0.10 - 10.104.0.200"
          }
        ],

        "option-data": [
          {
            "name": "routers",
            "data": "10.104.0.250"
          },
          {
            "name": "domain-name-servers",
            "data": "10.104.0.250"
          },
          {
            "name": "domain-name",
            "data": "innovate.lab"
          }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          {
            "output": "stdout"
          }
        ],
        "severity": "INFO"
      }
    ]
  }
}
